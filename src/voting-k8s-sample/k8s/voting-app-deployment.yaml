apiVersion: apps/v1
kind: Deployment
metadata:
  name: votingapp
  labels:
    app: votingapp
spec:
  selector:
    matchLabels:
      app: votingapp
  replicas: 1
  template:
    metadata:
      labels:
        app: votingapp
        orleans/serviceId: votingapp
        orleans/clusterId: votingapp
    spec:
      containers:
      - name: main
        image: acruswaksdevdemo.azurecr.io/orleans/votingapp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        - containerPort: 11111
        env:
        # Configure settings to let Orleans know which cluster it belongs to and which pod it is running in
        - name: ORLEANS_SERVICE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['orleans/serviceId']
        - name: ORLEANS_CLUSTER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['orleans/clusterId']
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: DOTNET_SHUTDOWNTIMEOUTSECONDS
          value: "120"
        - name: REDIS
          value: "redis" # The name of the redis service
      terminationGracePeriodSeconds: 180
      # imagePullSecrets:
      #   - name: votingappacr # REPLACEME
  minReadySeconds: 60
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1